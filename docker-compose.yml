version: '3.8'

services:
  # MySQL 데이터베이스
  db:
    image: mysql:8.0
    container_name: imean-mysql
    ports:
      - "9915:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: i_mean
    volumes:
      - imean-data:/var/lib/mysql
    networks:
      - imean-network
    restart: unless-stopped

  # Python FastAPI 서버
  python-api:
    build:
      context: ./I-mean-ai-chat-newdev
      dockerfile: Dockerfile
    container_name: imean-python-api
    ports:
      - "8000:8000"
    environment:
      - DB_URL=mysql+aiomysql://root:1234@db:3306/i_mean
      - OPENAI_API_KEY=your_openai_api_key_here
      - JWT_SECRET_KEY=your_jwt_secret_key_here_make_it_long_and_random_12345
    depends_on:
      - db
    networks:
      - imean-network
    restart: unless-stopped

  # Java Spring Boot 서버
  java-api:
    build:
      context: ./I-mean-backend-main
      dockerfile: Dockerfile
    container_name: imean-java-api
    ports:
      - "8080:8080"
    environment:
      - DEV_DB_URL=jdbc:mysql://db:3306/i_mean
      - DEV_DB_USERNAME=root
      - DEV_DB_PASSWORD=1234
      - JWT_SECRET_KEY=your_jwt_secret_key_here_make_it_long_and_random_12345
      - MAIL_USERNAME=test@example.com
      - MAIL_PASSWORD=test_password
    depends_on:
      - db
    networks:
      - imean-network
    restart: unless-stopped

  # Next.js 프론트엔드
  frontend:
    build:
      context: ./I-mean-frontend-main
      dockerfile: Dockerfile
    container_name: imean-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
      - NEXT_PUBLIC_PYTHON_API_URL=http://localhost:8000
    depends_on:
      - java-api
      - python-api
    networks:
      - imean-network
    restart: unless-stopped

volumes:
  imean-data:

networks:
  imean-network:
    driver: bridge